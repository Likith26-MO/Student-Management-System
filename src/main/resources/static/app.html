<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <h1>Student Portal Dashboard</h1>
        </div>
        <a href="index.html" class="btn btn-secondary logout-btn">Logout</a>
    </header>

    <main class="container">
        
        <!-- Left Side: Form -->
        <section class="form-section">
            <div class="card">
                <h2 id="formTitle">Add New Student</h2>
                <form id="studentForm">
                    
                    <div class="input-group">
                        <label for="usn">USN (University Seat Number)</label>
                        <input type="text" id="usn" placeholder="E.g. 1RV20CS001" required>
                    </div>

                    <div class="input-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="E.g. John Doe" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="E.g. john@example.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="course">Course</label>
                        <select id="course" required>
                            <option value="" disabled selected>Select an engineering branch</option>
                            <option value="Computer Science and Engineering">Computer Science and Engineering</option>
                            <option value="Information Science and Engineering">Information Science and Engineering</option>
                            <option value="Artificial Intelligence and Machine Learning">Artificial Intelligence & Machine Learning</option>
                            <option value="Electronics and Communication Engineering">Electronics and Communication Engineering</option>
                            <option value="Electrical and Electronics Engineering">Electrical and Electronics Engineering</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Civil Engineering">Civil Engineering</option>
                            <option value="Aerospace Engineering">Aerospace Engineering</option>
                            <option value="Biotechnology">Biotechnology</option>
                        </select>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="saveBtn">Save Student</button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">Cancel</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Right Side: Data Table -->
        <section class="data-section">
            <div class="card">
                <div class="table-header">
                    <h2>Student List</h2>
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Search by name or USN...">
                    </div>
                </div>
                <div class="department-tabs" id="departmentTabs">
                    <button type="button" class="department-tab active" data-department="">All Departments</button>
                    <button type="button" class="department-tab" data-department="Computer Science and Engineering">CSE</button>
                    <button type="button" class="department-tab" data-department="Information Science and Engineering">ISE</button>
                    <button type="button" class="department-tab" data-department="Artificial Intelligence and Machine Learning">AI/ML</button>
                    <button type="button" class="department-tab" data-department="Electronics and Communication Engineering">ECE</button>
                    <button type="button" class="department-tab" data-department="Electrical and Electronics Engineering">EEE</button>
                    <button type="button" class="department-tab" data-department="Mechanical Engineering">ME</button>
                    <button type="button" class="department-tab" data-department="Civil Engineering">CE</button>
                    <button type="button" class="department-tab" data-department="Aerospace Engineering">AE</button>
                    <button type="button" class="department-tab" data-department="Biotechnology">Biotech</button>
                </div>

                <div class="table-responsive">
                    <table id="studentTable">
                        <thead>
                            <tr>
                                <th>USN</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Course</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            <!-- Data dynamically injected via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js?v=4"></script>
</body>
</html>
